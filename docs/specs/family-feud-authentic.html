<!DOCTYPE html>
<title>Family Feud — Authentic Board Mockup</title>
<style>
  /* =====================================================================
     Family Feud projector board — a replica of the real show's gameboard.
     Colors here are intentionally OFF the Keeler palette (same sanctioned
     exception as the America Says board): bright TV-blue set, cyan-rimmed
     answer slots, amber LED pot, red strikes. Projector-only, nothing sold.
     This is the DESIGN MOCKUP that the AmericaSaysDisplay.vue equivalent
     (FamilyFeudDisplay.vue) will be ported from.
     ===================================================================== */
  :root{
    --set-core:#1e46c8; --set-mid:#0c2178; --set-deep:#050a2e;
    --board-1:#123bb0; --board-2:#081a5e;
    --rim:#4bd6ff; --rim-soft:#8fe6ff;
    --slot-1:#1c50d6; --slot-2:#0b2a86;
    --ans-1:#2f6bff; --ans-2:#1743bd;
    --pts-box:#06123f; --led:#ffd23f; --led-dim:#7a5f16;
    --ink:#f2f7ff; --strike:#ef2b1d;
    --frame:#ffd23f; /* marquee/board border color — follows the round (JS) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;overflow:hidden}

  .board{position:relative;width:100vw;height:100vh;overflow:hidden;
    background:
      repeating-linear-gradient(90deg, rgba(160,120,45,.10) 0 2px, rgba(0,0,0,0) 2px 96px),
      linear-gradient(90deg, rgba(180,130,50,.55) 0%, rgba(34,25,14,0) 18%, rgba(34,25,14,0) 82%, rgba(180,130,50,.55) 100%),
      radial-gradient(120% 100% at 50% 40%, #362a18 0%, #201810 56%, #120c07 100%);}
  /* gold proscenium — drawn as ONE continuous shape (SVG): an elliptical ring that
     bulges into a pod on each side, with the blue score screen nested INSIDE each
     pod (the box sits inside the bar, not overlapping it). */
  .ffsvg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(94vw,1620px);aspect-ratio:1620/880;z-index:1;pointer-events:none;display:none;
    filter:drop-shadow(0 0 30px rgba(240,180,60,.4)) drop-shadow(0 16px 40px rgba(0,0,0,.5));overflow:visible}
  .ffsvg.show{display:block}
  .ffscore{fill:#fff;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:56px;
    paint-order:stroke;stroke:#081026;stroke-width:4px;stroke-linejoin:round}
  .ffname{fill:#fff;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900;
    font-size:30px;text-transform:uppercase;letter-spacing:.5px;
    paint-order:stroke;stroke:#0a0a12;stroke-width:5px;stroke-linejoin:round}
  #ffsvg .ctrl rect{stroke:var(--tc,#4bd6ff);stroke-width:6px;
    filter:drop-shadow(0 0 12px var(--tc,#4bd6ff))}
  /* Full back WALL of light bulbs — the whole set is a lit board, not just a ring
     around the answers. A tiled dot grid is the bulb field; a soft radial mask
     fades it toward the edges for depth; a slow twinkle makes it breathe. */
  /* big blue glowing bulbs across the dark bronze wall */
  .board::before{content:"";position:absolute;inset:-2%;pointer-events:none;z-index:0;
    background-image:radial-gradient(circle,
      rgba(175,222,255,1) 0 2.6px,
      rgba(70,160,255,.82) 3.2px 4.7px,
      rgba(20,72,178,.28) 5.4px 7px,
      transparent 7.6px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(135% 122% at 50% 42%, #000 60%, rgba(0,0,0,.5) 84%, transparent 100%);
    mask-image:radial-gradient(135% 122% at 50% 42%, #000 60%, rgba(0,0,0,.5) 84%, transparent 100%);
    animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.7}50%{opacity:.95}}
  /* gentle blue light pooling over the wall */
  .wallglow{position:absolute;inset:0;z-index:0;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(62% 52% at 50% 44%, rgba(40,95,210,.3), transparent 76%);
    animation:drift 14s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate3d(-1%,0,0)}100%{transform:translate3d(1%,1%,0)}}
  /* blue stage-floor glow */
  .board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;
    background:linear-gradient(0deg, rgba(60,110,255,.40), rgba(60,110,255,0) 100%);
    filter:blur(10px);pointer-events:none}

  /* ---- Top bar: survey question banner + round / multiplier ------------- */
  .topbar{position:absolute;top:3.2%;left:50%;transform:translateX(-50%);
    width:78%;max-width:1180px;z-index:12;display:flex;flex-direction:column;align-items:center;gap:1.1vh}
  .roundtag{display:flex;align-items:center;gap:.6em;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--rim-soft);font-size:clamp(12px,1.4vw,22px);
    text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .mult{color:#04102e;background:linear-gradient(180deg,#ffe27a,var(--led));
    padding:.12em .7em;border-radius:999px;font-weight:900;letter-spacing:.04em;
    box-shadow:0 0 16px rgba(255,210,63,.6)}
  .survey{width:100%;text-align:center;color:#fff;font-weight:800;line-height:1.12;
    text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,2.5vw,42px);
    text-shadow:0 2px 4px rgba(0,0,0,.6);
    padding:1.1vh 2vw;border-radius:14px;
    background:linear-gradient(180deg, rgba(10,26,94,.72), rgba(6,16,64,.72));
    border:2px solid rgba(120,180,255,.35);
    box-shadow:inset 0 0 30px rgba(60,120,255,.25), 0 10px 30px rgba(0,0,0,.45)}
  .survey .lead{display:block;font-size:.52em;letter-spacing:.14em;color:var(--rim-soft);
    font-weight:800;margin-bottom:.25em;opacity:.9}

  /* ---- The answer board ------------------------------------------------- */
  .boardwrap{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    width:min(58vw,1000px);z-index:10}
  /* bright glowing YELLOW frame around the board (neon inner edge). */
  .frame{position:relative;padding:clamp(7px,1vw,15px);border-radius:16px;
    background:linear-gradient(180deg,#f3c145,#e2a62c);
    border:2px solid #6f440f;
    box-shadow:0 0 24px rgba(255,200,70,.4), 0 14px 36px rgba(0,0,0,.6),
      inset 0 0 0 2px rgba(255,244,180,.85), inset 0 -2px 5px rgba(0,0,0,.35)}
  /* black inner board the slots sit on */
  .panel{position:relative;border-radius:10px;padding:clamp(8px,1.05vw,16px);
    background:linear-gradient(180deg,#0c0f1a,#05070f);
    border:2px solid #000;box-shadow:inset 0 0 34px rgba(0,0,0,.75)}
  /* running-total "pot" — white number on a blue box inside a GOLD frame, centered
     ABOVE the answer board (matches the current set). */
  .pot{width:max-content;margin:0 auto clamp(8px,1.5vh,20px);
    padding:clamp(4px,.5vw,8px);border-radius:9px;
    background:linear-gradient(180deg,#9096a1,#565c66);   /* gray screen bezel */
    border:1px solid #33383f;
    box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,255,255,.55)}
  .pot .potnum{display:block;min-width:1.8em;text-align:center;padding:.04em .42em;border-radius:5px;
    color:#fff;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    font-size:clamp(30px,3.7vw,66px);
    background:
      radial-gradient(circle, rgba(150,205,255,.85) 0 1.4px, transparent 2.4px) 0 0/13px 13px,
      linear-gradient(180deg,#2f8bf2,#1560d6);
    border:1px solid #0f3f9e;text-shadow:0 2px 6px rgba(0,0,0,.6)}

  .slots{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,.85vw,13px)}
  .slot{position:relative;height:clamp(40px,6.6vh,80px);border-radius:7px;perspective:900px}
  .slot .inner{position:absolute;inset:0;transition:transform .6s cubic-bezier(.34,1.2,.5,1);
    transform-style:preserve-3d}
  .slot.open .inner{transform:rotateX(180deg)}
  .face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;
    display:flex;align-items:center;overflow:hidden;
    border:clamp(2px,.32vw,5px) solid #e3ecf6;                 /* silver/chrome bevel */
    box-shadow:0 0 0 1.5px #04060d,                            /* thin dark outer line */
      inset 0 0 0 2px rgba(24,52,110,.75),                     /* thin dark inner line */
      inset 0 5px 9px rgba(255,255,255,.5), inset 0 -9px 13px rgba(0,10,40,.42)}
  /* glossy blue slot fill (shared by blank + revealed faces) */
  .blank,.reveal{background:
      linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 16%),
      radial-gradient(120% 85% at 42% 40%, #5fb8ff 0%, #2b86f0 44%, #1560d6 100%)}
  .blank{justify-content:center}
  /* white number inside a raised navy OVAL badge with a shadow beneath it */
  .blank .num{display:flex;align-items:center;justify-content:center;
    width:clamp(46px,6.2vw,88px);height:clamp(28px,3.9vh,52px);border-radius:50%;
    font-weight:900;color:#fff;font-size:clamp(18px,2.5vw,40px);
    background:radial-gradient(120% 120% at 44% 32%, #3a72dc 0%, #0f327e 78%);
    border:2px solid #cfe6ff;
    box-shadow:0 6px 7px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.5),
      inset 0 -3px 6px rgba(0,0,0,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.6)}
  /* revealed face (back of the flip): white answer text + a lighter-blue points sub-box */
  .reveal{transform:rotateX(180deg)}
  .reveal .atext{flex:1 1 auto;padding:0 .35em 0 .7em;color:#fff;font-weight:900;
    text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-size:clamp(15px,2vw,34px);
    text-shadow:0 2px 3px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.5)}
  .reveal .apts{flex:0 0 auto;align-self:stretch;min-width:1.7em;display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:900;
    font-variant-numeric:tabular-nums;font-size:clamp(17px,2.2vw,38px);
    background:radial-gradient(120% 90% at 40% 38%, #86ccff, #3a93f4);
    border-left:3px solid rgba(4,6,13,.7);
    box-shadow:inset 2px 0 0 rgba(160,215,255,.7);
    text-shadow:0 2px 3px rgba(0,0,0,.5)}

  /* ---- Strikes overlay -------------------------------------------------- */
  .strikes{position:absolute;inset:0;z-index:30;display:none;align-items:center;
    justify-content:center;gap:clamp(14px,3vw,60px)}
  .strikes.show{display:flex;animation:pop .25s ease-out}
  /* Strike: a red rounded-square box with a glowing pink-white neon rim and a red X
     inside — transparent between, so the board shows through the box. */
  .xmark{font-weight:900;color:var(--strike);font-size:clamp(90px,18vw,300px);line-height:.8;
    width:1.05em;height:1.05em;display:flex;align-items:center;justify-content:center;
    border:.11em solid var(--strike);border-radius:.14em;background:transparent;
    box-shadow:
      inset 0 0 0 .02em rgba(255,205,205,.95),        /* bright neon rim inside the red border */
      inset 0 0 .12em .01em rgba(255,150,150,.8),
      0 0 .18em rgba(255,120,120,.7),
      0 0 50px rgba(239,43,29,.75);
    text-shadow:0 0 .06em rgba(255,190,190,.9), 0 0 22px rgba(239,43,29,.9)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* ---- Team scoreboards (bottom corners) -------------------------------- */
  .teams{position:absolute;left:0;right:0;bottom:4.5%;z-index:12;
    display:flex;justify-content:space-between;padding:0 4vw;pointer-events:none}
  .team{min-width:20%;text-align:center;padding:1vh 1.6vw;border-radius:16px;
    background:linear-gradient(180deg, rgba(8,20,72,.85), rgba(5,12,44,.9));
    border:3px solid var(--tc,#4bd6ff);
    box-shadow:0 0 26px rgba(0,0,0,.5), inset 0 0 22px rgba(0,0,0,.4)}
  .team.control{box-shadow:0 0 34px var(--tc), 0 0 26px rgba(0,0,0,.5);
    animation:glow 1.4s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 26px var(--tc),0 0 26px rgba(0,0,0,.5)}
    50%{box-shadow:0 0 52px var(--tc),0 0 26px rgba(0,0,0,.5)}}
  .team .tname{font-weight:900;text-transform:uppercase;letter-spacing:.05em;
    font-size:clamp(15px,1.8vw,30px);color:var(--tc,#fff);
    text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .team .tscore{font-weight:900;font-variant-numeric:tabular-nums;color:#fff;
    font-size:clamp(30px,4vw,68px);line-height:1;text-shadow:0 0 18px rgba(150,200,255,.5)}
  .team .tstrikes{display:flex;gap:.3em;justify-content:center;margin-top:.3vh;height:1.1em}
  .team .tstrikes b{color:var(--strike);font-size:clamp(16px,1.7vw,28px);font-weight:900;
    text-shadow:0 0 8px rgba(239,43,29,.8)}

  /* ---- Steal banner (bottom-right, replaces nothing — floats) ----------- */
  .stealbar{position:absolute;top:16%;left:50%;transform:translateX(-50%);z-index:22;
    display:none;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
    font-size:clamp(20px,2.6vw,46px);padding:.24em 1.1em;border-radius:999px;
    color:var(--tc,#fff);background:rgba(6,16,64,.82);border:3px solid currentColor;
    box-shadow:0 0 30px rgba(75,214,255,.5), inset 0 0 14px rgba(0,0,0,.4);
    animation:steal 1.1s ease-in-out infinite}
  .stealbar.show{display:block}
  @keyframes steal{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

  /* ---- Centered overlays (lobby / recap / winner / fast money) ---------- */
  .center{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:3.5vh;text-align:center;padding:4vw}
  .center.show{display:flex}
  .eyebrow{color:var(--led);font-weight:800;text-transform:uppercase;letter-spacing:.16em;
    font-size:clamp(16px,2vw,36px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .headline{color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(40px,7vw,120px);text-shadow:0 0 30px rgba(120,190,255,.7),0 4px 10px rgba(0,0,0,.6)}
  .subhead{color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.1em;
    font-size:clamp(20px,2.6vw,46px);text-shadow:0 0 16px rgba(120,190,255,.5)}
  .matchup{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(14px,2.4vw,40px)}
  .matchup .m{font-weight:900;text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(26px,3.8vw,66px);text-shadow:0 0 16px rgba(120,190,255,.4),0 2px 6px rgba(0,0,0,.6)}
  .matchup .vs{color:var(--ink);opacity:.7;font-weight:700;font-size:clamp(16px,2vw,34px)}
  .chips{display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);justify-content:center}
  .chip{display:flex;flex-direction:column;gap:.4vh;align-items:center;
    padding:1.6vh 2.6vw;border-radius:18px;background:rgba(6,16,64,.62);
    border:3px solid var(--tc,#4bd6ff);box-shadow:0 0 24px rgba(75,214,255,.35)}
  .chip .cn{font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tc,#fff);
    font-size:clamp(18px,2vw,34px)}
  .chip .cp{font-weight:900;color:#fff;font-variant-numeric:tabular-nums;
    font-size:clamp(34px,4.4vw,74px);text-shadow:0 0 16px rgba(150,200,255,.5)}

  /* Family Feud show lockup — yellow/orange wordmark on a navy OVAL badge with
     stacked gold + orange rings (the oval "badge behind it"). */
  .ff-logo{position:relative;display:inline-grid;place-items:center;
    padding:clamp(30px,6vw,84px) clamp(64px,13vw,210px)}
  /* blue dotted oval badge behind the logo: blue field + dots, ringed by an orange
     band inside a silver-blue chrome rim (part of the logo — shown on the lobby). */
  .ff-logo::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle, rgba(150,185,245,.55) 0 1.3px, transparent 2.1px) 0 0/17px 17px,
      radial-gradient(125% 125% at 50% 28%, #5474c6 0%, #33529f 55%, #274088 100%);
    box-shadow:
      inset 0 0 0 clamp(2px,.28vw,5px) rgba(190,215,255,.85),
      0 0 0 clamp(4px,.55vw,9px) #d5852a,
      0 0 0 clamp(9px,1.15vw,19px) #b3c4e0,
      0 0 0 clamp(10px,1.3vw,21px) #5f6f8e,
      0 0 34px rgba(80,120,220,.4),
      inset 0 8px 20px rgba(255,255,255,.28), inset 0 -14px 32px rgba(0,0,0,.42)}
  .ff-text{position:relative;display:flex;flex-direction:column;align-items:center;line-height:.84;
    /* depth via filter so it can't interfere with the gradient text fill */
    filter:drop-shadow(2px 3px 1px rgba(0,0,0,.5)) drop-shadow(1px 2px 0 #9c4418)}
  /* bold SERIF letters, orange(top)→yellow(bottom) gradient clipped to the text */
  .ff-1,.ff-2{font-family:Georgia,"Times New Roman",serif;font-weight:900;
    text-transform:uppercase;line-height:1;
    background-image:linear-gradient(180deg,#ef7a0e 0%,#ff9c1a 30%,#ffc21e 62%,#ffe83e 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent}
  .ff-1{letter-spacing:.01em;font-size:clamp(30px,5vw,86px)}
  .ff-2{letter-spacing:.01em;font-size:clamp(34px,5.8vw,100px);margin-top:-.02em}

  /* ---- Fast Money board ------------------------------------------------- */
  .fm{width:min(1100px,86vw);display:flex;flex-direction:column;gap:1.6vh}
  .fm .fmrow{display:grid;grid-template-columns:1fr auto;gap:clamp(8px,1vw,16px);align-items:stretch}
  .fm .fmq{display:flex;align-items:center;padding:.8vh 1.2vw;border-radius:10px;
    color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.01em;
    font-size:clamp(13px,1.5vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(180deg,var(--ans-1),var(--ans-2));
    border:2px solid rgba(150,210,255,.7);text-shadow:0 2px 4px rgba(0,0,0,.5)}
  .fm .fmp{min-width:2.4em;display:flex;align-items:center;justify-content:center;
    border-radius:10px;color:var(--led);font-weight:900;font-variant-numeric:tabular-nums;
    font-size:clamp(18px,2.2vw,40px);background:linear-gradient(180deg,#0a1a52,var(--pts-box));
    border:2px solid var(--rim);text-shadow:0 0 12px rgba(255,210,63,.7)}
  .fm .fmtotal{margin-top:.6vh;display:flex;align-items:center;justify-content:center;gap:.6em;
    font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#fff;
    font-size:clamp(22px,3vw,52px)}
  .fm .fmtotal .n{color:var(--led);font-variant-numeric:tabular-nums;
    font-size:clamp(34px,4.6vw,80px);text-shadow:0 0 16px rgba(255,210,63,.7)}

  /* ---- demo controls — NOT part of the board ---------------------------- */
  .controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
    display:flex;gap:7px;align-items:center;background:rgba(6,12,34,.92);
    border:1px solid #2a3a7a;border-radius:999px;padding:7px 12px;z-index:60;
    font-family:system-ui,sans-serif;font-size:12.5px;color:#cdd8ff;flex-wrap:wrap;max-width:96vw}
  .controls .grp{display:flex;gap:5px;align-items:center}
  .controls .sep{width:1px;height:20px;background:#2a3a7a;margin:0 3px}
  .controls button{background:#14226b;color:#eaf1ff;border:1px solid #3a4da0;
    border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:600}
  .controls button.on{background:#2f6bff;border-color:#8fe6ff}
  @media (prefers-reduced-motion: reduce){
    .slot .inner{transition:none}.team.control,.stealbar{animation:none}
  }
</style>

<div class="board" id="board">

  <!-- drifting light washes over the bulb wall -->
  <div class="wallglow"></div>

  <!-- gold proscenium: one continuous ring that bulges into a pod on each side,
       with the blue score screen nested inside each pod -->
  <svg class="ffsvg" id="ffsvg" viewBox="0 0 1620 880" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <linearGradient id="ffgold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f3c145"/><stop offset=".5" stop-color="#eab234"/>
        <stop offset="1" stop-color="#dda328"/>
      </linearGradient>
      <pattern id="ffdots" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" fill="#1a5fd0"/>
        <circle cx="3" cy="3" r="1.3" fill="#a8d6ff" opacity=".85"/>
      </pattern>
    </defs>
    <!-- ONE continuous gold bar: oval arcs that run into each score box and trace its
         outer three sides, then rejoin the oval (the box interrupts the oval). -->
    <path id="ffring" fill="none" stroke-linejoin="round" stroke-linecap="round"
      d="M1490,350 L1600,350 L1600,530 L1490,530 A740,485 0 0 1 130,530 L20,530 L20,350 L130,350 A740,485 0 0 1 1490,350 Z"/>
    <use href="#ffring" stroke="#6f420f" stroke-width="40"/>
    <use href="#ffring" stroke="url(#ffgold)" stroke-width="32"/>
    <use href="#ffring" stroke="#ffe27a" stroke-width="5" opacity=".55"/>
    <!-- blue score screens nested in the side pockets (tall rectangles) -->
    <g id="scoreLwrap">
      <rect x="42" y="376" width="92" height="128" rx="9" fill="url(#ffdots)" stroke="#0f3f9e" stroke-width="3"/>
      <text id="scoreL" class="ffscore" x="88" y="440" text-anchor="middle" dominant-baseline="central">0</text>
      <text id="nameL" class="ffname" x="6" y="668" text-anchor="start"></text>
    </g>
    <g id="scoreRwrap">
      <rect x="1486" y="376" width="92" height="128" rx="9" fill="url(#ffdots)" stroke="#0f3f9e" stroke-width="3"/>
      <text id="scoreR" class="ffscore" x="1532" y="440" text-anchor="middle" dominant-baseline="central">0</text>
      <text id="nameR" class="ffname" x="1614" y="668" text-anchor="end"></text>
    </g>
  </svg>

  <!-- survey question + round / multiplier -->
  <div class="topbar" id="topbar">
    <div class="roundtag"><span id="roundlabel">Round 3</span><span class="mult" id="mult">Double</span></div>
    <div class="survey"><span id="survey"></span></div>
  </div>

  <!-- the answer board -->
  <div class="boardwrap" id="boardwrap">
    <div class="pot"><span class="potnum" id="pot">0</span></div>
    <div class="frame">
      <div class="panel">
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="strikes" id="strikes"></div>
  </div>

  <!-- steal banner -->
  <div class="stealbar" id="stealbar"></div>

  <!-- ===== centered overlays ===== -->
  <div class="center" id="lobby">
    <div class="ff-logo"><span class="ff-text"><span class="ff-1">Family</span><span class="ff-2">Feud</span></span></div>
    <div class="matchup" id="lobbyMatch"></div>
    <div class="subhead">Waiting to Start</div>
  </div>

  <div class="center" id="recap">
    <div class="eyebrow" id="recapEye">End of Round 3 · Scores</div>
    <div class="chips" id="recapChips"></div>
  </div>

  <div class="center" id="fastmoney">
    <div class="eyebrow">Fast Money</div>
    <div class="fm" id="fmBoard"></div>
  </div>

  <div class="center" id="winner">
    <div class="eyebrow">Game Over</div>
    <div class="headline" id="winName">The Keelers</div>
    <div class="subhead">Wins!</div>
    <div class="chips" id="winChips"></div>
  </div>
</div>

<div class="controls">
  <span class="grp"><span>State:</span>
    <button data-state="lobby">Lobby</button>
    <button data-state="faceoff">Face-off</button>
    <button data-state="play" class="on">Play</button>
    <button data-state="recap">Recap</button>
    <button data-state="fastmoney">Fast Money</button>
    <button data-state="winner">Winner</button></span>
  <span class="sep"></span>
  <span class="grp"><span>Answers:</span>
    <button data-n="5">5</button><button data-n="6">6</button>
    <button data-n="7">7</button><button data-n="8" class="on">8</button></span>
  <span class="sep"></span>
  <span class="grp"><span>Multiplier:</span>
    <button data-m="1">1×</button><button data-m="2" class="on">2×</button>
    <button data-m="3">3× / FM</button></span>
  <span class="sep"></span>
  <span class="grp"><button id="revealBtn">Reveal next</button>
    <button id="strikeBtn">Strike</button>
    <button id="stealBtn">Steal</button>
    <button id="resetBtn">Reset round</button></span>
  <span class="sep"></span>
  <span class="grp"><span>Fast&nbsp;Money:</span>
    <button id="fmTimer1Btn">Timer 1</button>
    <button id="fmTimer2Btn">Timer 2</button>
    <button id="fmRevealBtn">Answer</button>
    <button id="fmPointsBtn">Points</button>
    <button id="fmZeroBtn">Zero</button></span>
  <span class="sep"></span>
  <span class="grp"><button id="muteBtn" class="on">&#128266; Sound</button></span>
</div>

<script>
  // --- demo data -------------------------------------------------------------
  const TEAMS = [
    { name: 'The Keelers', color: '#ff5a4d', score: 212 },
    { name: 'Team Williams', color: '#4bd6ff', score: 168 },
  ];
  const MULT = { 1:'', 2:'Double', 3:'Triple' };

  const ROUNDS = {
    5:{ q:'Name a snack you sneak into a movie theater',
        a:[['CANDY',38],['SODA',22],['POPCORN',16],['CHIPS',12],['CHOCOLATE BAR',6]] },
    6:{ q:'Name something you always pack for a beach day',
        a:[['TOWEL',31],['SUNSCREEN',24],['COOLER',15],['UMBRELLA',12],['SUNGLASSES',9],['CHAIR',5]] },
    7:{ q:'Name a chore kids will do anything to get out of',
        a:[['DISHES',27],['TAKING OUT TRASH',21],['LAUNDRY',18],['VACUUMING',13],['MAKING BED',9],['MOWING',7],['CLEAN ROOM',3]] },
    8:{ q:'Name something people do the moment they wake up',
        a:[['CHECK PHONE',26],['HIT SNOOZE',19],['USE BATHROOM',15],['DRINK COFFEE',13],
           ['STRETCH',10],['BRUSH TEETH',8],['CHECK TIME',5],['TURN OFF ALARM',4]] },
  };

  // --- state -----------------------------------------------------------------
  let numAnswers = 8;
  let state = 'play';
  let openCount = 0;        // how many answers revealed
  let strikes = 0;          // current-team strikes
  let steal = false;
  let controlTeam = 0;      // index into TEAMS with control this round

  const el = id => document.getElementById(id);

  // --- sound effects ---------------------------------------------------------
  // Family Feud clips live in public/sounds/family-feud/. Served from the app
  // web root at /sounds/family-feud/ when this board runs inside the app; when
  // the mockup is opened straight from disk (file://), fall back to a relative
  // path into public/. Each clip is a cached <audio> restarted on replay — the
  // same behaviour as the app's useSoundEffects() composable.
  const SOUND_BASE = location.protocol === 'file:'
    ? '../../public/sounds/family-feud/'
    : '/sounds/family-feud/';
  const SFX = {
    intro:'Intro.m4a', answerReveal:'AnswerReveal.m4a', strike:'Strike.m4a', buzzer:'Buzzer.m4a',
    fmTimer1:'FastMoneyTimer1.m4a', fmTimer2:'FastMoneyTimer2.m4a',
    fmAnswer:'FastMoneyAnswerReveal.m4a', fmPoints:'FastMoneyPointsReveal.m4a', fmZero:'FastMoneyZeroPoints.m4a',
  };
  const _audio = {};
  let soundOn = true;
  function sfx(name){
    if(!soundOn) return;
    let a = _audio[name];
    if(!a){ a = _audio[name] = new Audio(SOUND_BASE + SFX[name]); a.volume = 0.7; }
    try { a.currentTime = 0; a.play().catch(()=>{}); } catch(e){}
  }

  function pot(){
    const list = ROUNDS[numAnswers].a;
    let sum = 0;
    for (let i=0;i<openCount;i++) sum += list[i][1];
    const m = Number(el('mult').dataset.m || 2);
    return sum * m;
  }

  // The physical board is always 8 panels (two columns of 4). Numbers run 1–4 down
  // the left column, 5–8 down the right; a question with fewer answers leaves the
  // extra panels as plain blue bars (no number, no answer) — like the real board.
  const DOM_ORDER = [0,4,1,5,2,6,3,7]; // grid is row-major 2-col → answer index per cell
  function renderBoard(){
    const data = ROUNDS[numAnswers];
    el('survey').textContent = data.q;
    const slots = el('slots');
    slots.className = 'slots';
    slots.innerHTML = '';
    DOM_ORDER.forEach(ai => {
      const exists = ai < numAnswers;
      const ans = exists ? data.a[ai] : null;
      const open = exists && ai < openCount;
      const cell = document.createElement('div');
      cell.className = 'slot' + (open ? ' open' : '') + (exists ? '' : ' empty');
      if (exists) cell.dataset.ai = ai;   // answer index → lets Reveal flip this exact panel
      cell.innerHTML =
        `<div class="inner">
           <div class="face blank">${exists ? `<span class="num">${ai+1}</span>` : ''}</div>
           <div class="face reveal"><span class="atext">${ans ? ans[0] : ''}</span><span class="apts">${ans ? ans[1] : ''}</span></div>
         </div>`;
      slots.appendChild(cell);
    });
    el('pot').textContent = pot();
  }

  function renderStrikes(){
    const box = el('strikes');
    box.classList.toggle('show', strikes > 0 && (state==='faceoff'||state==='play'));
    box.innerHTML = '';
    for (let i=0;i<strikes;i++){ const x=document.createElement('div'); x.className='xmark'; x.textContent='✕'; box.appendChild(x); }
  }

  function renderTeams(){
    const show = (state==='faceoff'||state==='play');
    el('ffsvg').classList.toggle('show', show);
    const wraps = [el('scoreLwrap'), el('scoreRwrap')];
    const texts = [el('scoreL'), el('scoreR')];
    const names = [el('nameL'), el('nameR')];
    // control = the team holding the board (or the opponent during a steal)
    const holder = steal ? (controlTeam + 1) % TEAMS.length : controlTeam;
    TEAMS.forEach((t, idx) => {
      if (!texts[idx]) return;
      texts[idx].textContent = t.score;          // score stays white (LED look)
      names[idx].textContent = t.name;           // family name under its score box
      names[idx].style.fill = t.color;           // inline style beats the .ffname CSS rule
      wraps[idx].classList.toggle('ctrl', show && idx === holder);
      wraps[idx].style.setProperty('--tc', t.color);
    });
  }

  function renderSteal(){
    const b = el('stealbar');
    b.classList.toggle('show', steal && (state==='play'||state==='faceoff'));
    if (steal){ const t = TEAMS[(controlTeam+1)%TEAMS.length]; b.style.setProperty('--tc', t.color);
      b.textContent = `${t.name} — Steal!`; }
  }

  function renderRoundTag(){
    const m = Number(el('mult').dataset.m || 2);
    el('roundlabel').textContent = 'Round 3';
    const mult = el('mult');
    if (MULT[m]) { mult.style.display=''; mult.textContent = MULT[m]; } else { mult.style.display='none'; }
  }

  function renderLobby(){
    const wrap = el('lobbyMatch'); wrap.innerHTML='';
    TEAMS.forEach((t,i)=>{ if(i>0){const vs=document.createElement('span');vs.className='vs';vs.textContent='vs';wrap.appendChild(vs);}
      const m=document.createElement('span');m.className='m';m.style.color=t.color;m.textContent=t.name;wrap.appendChild(m);});
  }

  function renderChips(container){
    const wrap = el(container); wrap.innerHTML='';
    [...TEAMS].forEach(t=>{ const c=document.createElement('div');c.className='chip';c.style.setProperty('--tc',t.color);
      c.innerHTML=`<span class="cn" style="color:${t.color}">${t.name}</span><span class="cp">${t.score}</span>`;wrap.appendChild(c);});
  }

  function renderFastMoney(){
    const FM = [
      ['Name a fruit you put in a smoothie', 42],
      ['A month people love to get married in', 28],
      ['Something you find in a junk drawer', 35],
      ['A place you hate waiting in line', 19],
      ['Name a popular pizza topping', 47],
    ];
    const wrap = el('fmBoard'); wrap.innerHTML=''; let total=0;
    FM.forEach(([q,p])=>{ total+=p; const r=document.createElement('div');r.className='fmrow';
      r.innerHTML=`<div class="fmq">${q}</div><div class="fmp">${p}</div>`;wrap.appendChild(r);});
    const tot=document.createElement('div');tot.className='fmtotal';
    tot.innerHTML=`Total <span class="n">${total}</span> / 200`;wrap.appendChild(tot);
  }

  // --- state switching -------------------------------------------------------
  function setState(s){
    state = s;
    ['lobby','recap','fastmoney','winner'].forEach(id=>el(id).classList.toggle('show', id===s));
    const boardVisible = (s==='faceoff'||s==='play');
    el('topbar').style.display = boardVisible ? '' : 'none';
    el('boardwrap').style.display = boardVisible ? '' : 'none';
    el('ffsvg').classList.toggle('show', boardVisible);   // oval frames the board only
    if (s==='faceoff'){ openCount=0; strikes=0; steal=false; }
    renderAll();
    // per-state overlay content
    if (s==='lobby'){ renderLobby(); sfx('intro'); }
    if (s==='recap'){ el('recapEye').textContent='End of Round 3 · Scores'; renderChips('recapChips'); }
    if (s==='winner'){ el('winName').textContent=TEAMS[0].name; renderChips('winChips'); }
    if (s==='fastmoney') renderFastMoney();
  }

  function renderAll(){ renderRoundTag(); renderBoard(); renderStrikes(); renderTeams(); renderSteal(); }

  // --- controls --------------------------------------------------------------
  document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('on', x===b));
    setState(b.dataset.state);
  });
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on', x===b));
    numAnswers = Number(b.dataset.n); openCount=Math.min(openCount,numAnswers); renderAll();
  });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on', x===b));
    el('mult').dataset.m = b.dataset.m; renderAll();
  });
  // Reveal the next answer by flipping its existing panel (add .open → CSS runs the
  // flip). We do NOT rebuild the board here, or the panel would appear already-turned.
  el('revealBtn').onclick=()=>{
    if(openCount>=numAnswers) return;
    const cell = el('slots').querySelector('.slot[data-ai="'+openCount+'"]');
    if(cell) cell.classList.add('open');
    openCount++;
    el('pot').textContent = pot();
    renderTeams();
    sfx('answerReveal');
  };
  el('strikeBtn').onclick=()=>{ strikes=(strikes%3)+1; renderStrikes(); renderTeams();
    // Third strike ends the team's turn → the buzzer; the 1st/2nd get the strike honk.
    sfx(strikes>=3 ? 'buzzer' : 'strike'); };
  el('stealBtn').onclick=()=>{ steal=!steal; renderSteal(); renderTeams(); };
  el('resetBtn').onclick=()=>{ openCount=0; strikes=0; steal=false; renderAll(); };

  // Fast Money clips — no per-answer sim on this board, so trigger them directly.
  el('fmTimer1Btn').onclick=()=>sfx('fmTimer1');
  el('fmTimer2Btn').onclick=()=>sfx('fmTimer2');
  el('fmRevealBtn').onclick=()=>sfx('fmAnswer');
  el('fmPointsBtn').onclick=()=>sfx('fmPoints');
  el('fmZeroBtn').onclick=()=>sfx('fmZero');

  // Mute toggle — stop the effects while working on the visual design.
  el('muteBtn').onclick=function(){ soundOn=!soundOn;
    this.classList.toggle('on', soundOn);
    this.innerHTML = soundOn ? '&#128266; Sound' : '&#128263; Muted';
    if(!soundOn) Object.values(_audio).forEach(a=>{ a.pause(); a.currentTime=0; }); };

  // default: mid-round play with a few answers up and one strike
  el('mult').dataset.m = 2;
  openCount = 4; strikes = 1;
  setState('play');
</script>
